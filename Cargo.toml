[package]
name = "the-operating-table"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A local laboratory for direct, reversible neural-network weight surgery"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
anyhow = "1"
axum = "0.8"
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
dotenvy = "0.15"
hf-hub = "0.4"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
